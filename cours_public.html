<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <title>JSP Pacy-sur-Eure — Cours</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0f1e;--panel:#111827;--card:#1a2236;--border:#1e3a5f;
      --txt:#e2e8f0;--txt-muted:#64748b;--sdis-bleu:#003087;
      --sdis-or:#e8a020;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;
      --radius:10px;--radius-sm:6px;
    }
    body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}

    header{background:var(--panel);border-bottom:3px solid var(--sdis-bleu);padding:14px 20px;
      display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;}
    .header-text h1{font-size:17px;font-weight:700;color:var(--sdis-or);}
    .header-text p{font-size:11px;color:var(--txt-muted);}

    .container{max-width:640px;margin:0 auto;padding:20px 16px;}

    .section-title{font-size:13px;font-weight:700;color:var(--txt-muted);
      text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;
      display:flex;align-items:center;gap:8px;}
    .section-title::after{content:'';flex:1;height:1px;background:var(--border);}

    /* Écran PIN */
    .pin-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
      padding:24px 20px;max-width:340px;margin:40px auto;text-align:center;}
    .pin-card h2{font-size:16px;margin-bottom:14px;color:var(--txt);}
    .pin-card select, .pin-card input{
      width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
      color:var(--txt);padding:10px 12px;font-size:15px;outline:none;margin-bottom:10px;}
    .pin-card input{text-align:center;letter-spacing:.3em;font-size:20px;font-weight:700;}
    .pin-card button{width:100%;background:var(--sdis-bleu);color:#fff;border:none;border-radius:var(--radius-sm);
      padding:11px;font-size:14px;font-weight:700;cursor:pointer;}
    .pin-card button:active{opacity:.85;}
    .pin-error{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px;}

    /* Carte cours */
    .cours-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
      padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--sdis-bleu);}
    .cours-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;
      background:rgba(0,48,135,.2);color:var(--sdis-or);margin-bottom:6px;}
    .cours-titre{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:4px;}
    .cours-desc{font-size:12px;color:var(--txt-muted);margin-bottom:10px;}
    .cours-link{display:inline-flex;align-items:center;gap:6px;background:var(--sdis-bleu);color:#fff;
      text-decoration:none;font-size:13px;font-weight:600;padding:7px 14px;border-radius:var(--radius-sm);}

    .empty{text-align:center;padding:40px 20px;color:var(--txt-muted);}
    .empty-icon{font-size:40px;margin-bottom:10px;}
    .loading{text-align:center;padding:40px;color:var(--txt-muted);}
    .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--sdis-bleu);
      border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
    @keyframes spin{to{transform:rotate(360deg)}}

    footer{text-align:center;padding:24px 16px;font-size:11px;color:var(--txt-muted);
      border-top:1px solid var(--border);margin-top:20px;}
    footer a{color:var(--sdis-bleu);text-decoration:none;}

    @media(max-width:400px){
      header{padding:10px 14px;}
      .header-text h1{font-size:15px;}
      .container{padding:14px 12px;}
    }
  </style>
</head>
<body>

<header>
  <div class="header-text">
    <h1>JSP Pacy-sur-Eure</h1>
    <p>📚 Supports de cours</p>
  </div>
</header>

<div class="container">
  <div id="content">
    <div class="loading"><div class="spinner"></div>Chargement...</div>
  </div>
</div>

<footer>
  Contenu en lecture seule — <a href="index.html" target="_blank">Espace formateurs</a>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSSMGVAQ2ygh2KjPVwePxBnq8_oO6Bzik",
  authDomain: "jsp-manager.web.app",
  projectId: "base-jsp-pacy",
  storageBucket: "base-jsp-pacy.firebasestorage.app",
  messagingSenderId: "457252011375",
  appId: "1:457252011375:web:86fe0842684edc24227c9a"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const content = document.getElementById('content');
let publicData = null; // {cours:[...], jsps:[{id,prenom,pin}]}
let unlockedJsp = null; // {id,prenom} une fois le PIN validé

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function renderPinScreen(){
  const jsps = (publicData.jsps||[]).slice().sort((a,b)=>a.prenom.localeCompare(b.prenom));
  content.innerHTML = `
    <div class="pin-card">
      <h2>🔑 Accès aux cours</h2>
      <select id="pin-jsp">
        <option value="">— Choisis ton prénom —</option>
        ${jsps.map(j => `<option value="${esc(j.id)}">${esc(j.prenom)}</option>`).join('')}
      </select>
      <input type="text" id="pin-code" maxlength="4" inputmode="numeric" placeholder="Code PIN">
      <button id="pin-submit">Voir les cours</button>
      <div class="pin-error" id="pin-error"></div>
    </div>`;
  document.getElementById('pin-submit').onclick = () => {
    const jspId = document.getElementById('pin-jsp').value;
    const code = document.getElementById('pin-code').value.trim();
    const err = document.getElementById('pin-error');
    if(!jspId){ err.textContent = 'Choisis ton prénom'; return; }
    const j = (publicData.jsps||[]).find(x => String(x.id) === jspId);
    if(!j || !j.pin || j.pin !== code){ err.textContent = 'Code incorrect'; return; }
    unlockedJsp = j;
    renderCours();
  };
}

function renderCours(){
  const list = (publicData.cours||[]).slice()
    .sort((a,b) => (a.titre||'').localeCompare(b.titre||''));

  if(!list.length){
    content.innerHTML = '<div class="empty"><div class="empty-icon">📚</div>Aucun support de cours disponible pour le moment.</div>';
    return;
  }

  let html = `<div class="section-title">Bonjour ${esc(unlockedJsp.prenom)} 👋</div>`;
  html += list.map(c => `
    <div class="cours-card">
      <span class="cours-badge">${esc(c.cycle||'Tous')}</span>
      <div class="cours-titre">${esc(c.titre)}</div>
      ${c.desc ? `<div class="cours-desc">${esc(c.desc)}</div>` : ''}
      <a class="cours-link" href="${esc(c.lien)}" target="_blank" rel="noopener">🔗 Ouvrir le support</a>
    </div>`).join('');
  content.innerHTML = html;
}

onSnapshot(doc(db, 'public_cours', 'pacy'), snap => {
  if(!snap.exists()){
    content.innerHTML = '<div class="empty"><div class="empty-icon">📚</div>Aucun cours publié pour le moment.</div>';
    return;
  }
  publicData = snap.data();
  if(unlockedJsp) renderCours();
  else renderPinScreen();
}, err => {
  content.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Impossible de charger les cours.<br><small>' + err.message + '</small></div>';
});
</script>
</body>
</html>
